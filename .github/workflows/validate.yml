name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every prompt folder
        run: ./scripts/validate.py --strict

      - name: Test the validator
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
