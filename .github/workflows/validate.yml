name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every prompt folder
        run: ./scripts/validate.py --strict

      - name: Test the validator and the resolver
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Phrasings and probes resolve as recorded
        run: ./scripts/check_phrasings.py

      - name: docs/phrasings.md is current
        run: ./scripts/check_phrasings.py --check

      - name: The published page still matches the repo
        run: ./scripts/check_page.py

      - name: The measured rates still match what the docs claim
        run: ./scripts/measure_invocation.py --check
